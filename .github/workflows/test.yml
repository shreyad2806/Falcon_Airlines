name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: Falcon-Airlines/falcon-airlines-enterprise/backend/pom.xml

      - name: Run tests
        working-directory: Falcon-Airlines/falcon-airlines-enterprise/backend
        run: mvn -B verify

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: Falcon-Airlines/falcon-airlines-enterprise/backend/target/surefire-reports
