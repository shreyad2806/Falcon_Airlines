spring:
  application:
    name: falcon-airlines-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    banner-mode: console
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
  info:
    build:
      enabled: true
    env:
      enabled: true

jwt:
  secret: ${JWT_SECRET:FalconAirlinesDefaultSecretKeyForJwtHmacAtLeast32Chars}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800}

# Flight data provider configuration
# Switch between: mock (database), aviationstack (live API)
flight:
  provider: ${FLIGHT_PROVIDER:mock}
  aviationstack:
    api-key: ${AVIATIONSTACK_API_KEY:}
    base-url: ${AVIATIONSTACK_BASE_URL:https://api.aviationstack.com/v1}
    connect-timeout: 5000
    read-timeout: 10000
    cache-ttl-seconds: 300
