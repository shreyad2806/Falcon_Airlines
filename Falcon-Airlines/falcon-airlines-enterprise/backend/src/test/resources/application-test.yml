spring:
  config:
    activate:
      on-profile: test
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: false

jwt:
  secret: this-is-a-very-long-test-secret-key-32-characters
  access-token-expiration: 900
  refresh-token-expiration: 604800

logging:
  level:
    root: INFO
    com.falcon.airlines: DEBUG
    org.testcontainers: DEBUG
    com.github.dockerjava: DEBUG
    org.springframework.web: INFO
