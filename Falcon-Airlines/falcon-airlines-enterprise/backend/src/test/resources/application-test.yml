spring:
  config:
    activate:
      on-profile: test
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    com.falcon.airlines: DEBUG
    org.testcontainers: INFO
    org.springframework.web: INFO
